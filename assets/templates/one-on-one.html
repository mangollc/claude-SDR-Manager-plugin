<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$title</title>
<style>$css</style>
</head>
<body>
<section class="page">
  $masthead
  <div class="rep-head">
    <div>
      <p class="eyebrow">$meta</p>
      <h1>$rep</h1>
    </div>
    <p class="rep-status">$status</p>
  </div>
  <div class="split">
    <div class="focus-panel">
      <h2>Coaching focus</h2>
      <p class="focus-line">$focus</p>
      <p class="rep-note">$focus_summary</p>
      <h3>Evidence</h3>
      <ul>$evidence</ul>
    </div>
    <div>
      <h2>Wins</h2>
      <ul>$wins</ul>
      <h2>Commitments from last time</h2>
      <ul>$commitments</ul>
      <h3>Progress</h3>
      <ul>$progress</ul>
    </div>
  </div>
  <div class="split split-even">
    <div>
      <h2>Questions to ask</h2>
      <ol class="questions">$questions</ol>
    </div>
    <div>
      <h2>Agenda</h2>
      <table class="ledger agenda">$agenda</table>
    </div>
  </div>
  <div class="split split-even notes-row">
    <div>
      <h2>The five steps</h2>
      $steps
    </div>
    <div class="notes-column">
      <h2>Meeting notes</h2>
      <div class="ruled"></div>
    </div>
  </div>
  $footer
</section>
</body>
</html>
